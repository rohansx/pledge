[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pledge"
version = "0.0.1"
description = "Pledge: fault proxy, fake providers and the run loop that drive one sandbox scan"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
# The engine is only needed where runs execute (inside the sandbox, or locally for the hand loop).
engine = ["litetraffic @ git+https://github.com/rohansx/litetraffic@0c8cf17a5da17ad9123625b30a336115760ebd2a"]
# The E2B SDK is only needed outside the sandbox, by `pledge scan`.
scan = ["e2b>=2.64,<3"]
# The Anthropic SDK is only needed outside the sandbox, by `pledge author`.
agent = ["anthropic>=2.12,<3"]
# The control-plane API: `uvicorn pledge.api.app:app`.
api = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "psycopg[binary,pool]>=3.2,<4"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
pledge = "pledge.cli:main"

[tool.setuptools.packages.find]
include = ["pledge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
